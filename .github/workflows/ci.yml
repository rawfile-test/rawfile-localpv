name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  schedule:
    - cron: '0 0 * * *'
  merge_group:

jobs:
  changes:
    uses: ./.github/workflows/docs-only.yml
  
  merge-q:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    outputs:
      skip: ${{ steps.check.outputs.skip-check }}
    steps:
      - id: check
        uses: cariad-tech/merge-queue-ci-skipper@main
      - run: |
          echo "Got: ${{ steps.check.outputs.skip-check }}"

  helm-ci:
    needs: [changes, merge-q]
    if: ${{ needs.merge-q.outputs.skip == 'false' && (github.event_name != 'pull_request' || needs.changes.outputs.docs-only == 'false') }}
    uses: ./.github/workflows/helm-chart.yml
  k8s-ci:
    needs: changes
    if: ${{ needs.merge-q.outputs.skip == 'false' && (github.event_name != 'pull_request' || needs.changes.outputs.docs-only == 'false') }}
    uses: ./.github/workflows/k8s.yml
  ci:
    if: ${{ success() }}
    needs:
      - helm-ci
      - k8s-ci
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
