name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - develop
      - 'release/**'
  schedule:
    - cron: '0 0 * * *'
  merge_group:

jobs:
  skipper:
    uses: ./.github/workflows/docs-only.yml
    secrets: inherit
    with:
      event-name: ${{ github.event_name }}
      base-ref: ${{ github.base_ref || github.event.merge_group.base_ref }}

  helm-ci:
    uses: ./.github/workflows/helm-chart.yml

  k8s-ci:
    needs: skipper
    if: needs.skipper.outputs.skip-k8s != 'true'
    uses: ./.github/workflows/k8s.yml

  ci:
    if: always()
    needs:
      - skipper
      - helm-ci
      - k8s-ci
    env:
      NEEDS_JSON: "${{toJSON(needs)}}"
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - run: "[ $ALL_SUCCESS == true ]"
      - name: CI succeeded
        run: exit 0
