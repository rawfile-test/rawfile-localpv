queue_rules:
  - name: default
    update_method: rebase
    merge_method: merge
    allow_inplace_checks: true
    batch_size: 10

merge_queue:
  max_parallel_checks: 1

pull_request_rules:
  - name: disable manual merging
    conditions:
      - base=develop
    actions:
      queue:
        method: merge
        name: default
    disallow_checks:
      mergeable_state: dirty
 
